name: test

# The light tests on every push to main and every pull request. The full suite is run
# locally before a merge (scripts/test.sh full); see doc/testing.md.
# Tests that need real recordings skip themselves when the data is absent.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MVIS with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[apriltag,aruco,ros1,dev]"

      - name: No absolute home-directory paths in tracked files
        # only on the public repository: maintainer checkouts may hold local configs
        if: github.repository == 'openmvis/openmvis'
        run: |
          if git grep -nIE '/home/[A-Za-z]|/Users/[A-Za-z]' -- . ':!.github'; then
            echo "::error::absolute home-directory path found; use \${MVIS_DATASETS} or a relative path"
            exit 1
          fi

      - name: Machine
        # Results can differ in the last digits between CPUs, so every log says which one ran.
        run: |
          nproc
          lscpu | grep -E 'Model name|Thread|Core|Flags' | cut -c1-200
          python -m pip list 2>/dev/null | grep -iE '^(numpy|scipy|gtsam|pytest|pytest-xdist|pytest-timeout) '
          python -c "from threadpoolctl import threadpool_info as t; print(t())" || true

      - name: Unit tests
        # --timeout names a stuck test with a stack trace instead of letting the job die silently.
        run: >
          scripts/test.sh unit
          --timeout=300 --timeout-method=thread
          --durations=30 --junitxml=pytest-unit.xml

      - name: Solver checks
        run: >
          scripts/test.sh solver
          --timeout=300 --timeout-method=thread
          --durations=5 --junitxml=pytest-solver.xml

      - name: Keep per-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pytest-results
          path: pytest-*.xml
          if-no-files-found: ignore
