name: macos

# MVIS on macOS (Apple silicon) with the pinned GTSAM 4.2 and with 4.3.0, the
# candidate for lifting the `gtsam<4.3` pin. Weekly and on demand, not on every
# push: macOS runner minutes are the scarce ones.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14            # arm64 (M1)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gtsam: ["4.2.2", "4.3.0"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install MVIS with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[apriltag,ros1,dev]"
          # 4.3.0 is outside the pin on purpose: this job is the test for lifting it
          pip install "gtsam==${{ matrix.gtsam }}"
          python -c "import numpy, gtsam, importlib.metadata as m; print('numpy', numpy.__version__, 'gtsam', m.version('gtsam'))"

      - name: Installation verification (Stage 0)
        run: mvis check --env --smoke || [ $? -eq 1 ]   # exit 1 = warnings only (e.g. gtsam 4.3)

      - name: Test suite
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest tests/ -q -p no:cacheprovider
