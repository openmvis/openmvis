calib: calibration.yaml
input: raw.bag
output: corrected.bag

corrections:
  imu_intrinsics: true
  remove_bias: true
  td: true
  t_ga: true
  undistort: false

# Optional when calibration results already contain each sensor's ROS topic:
# mapping:
#   /imu0: imu0
#   /cam0/image_raw: cam0
# base_imu_topic: /imu0
