# Cam-IMU calibration — TUM-VI raw IMU-calib bags, stereo equidistant + imu0.
#
# Same rig as cam_imu_omni.yaml, but seeded with the equidistant (KB4) camchain.
# Demonstrates the equidistant model; the recovered lever/baseline/td agree with
# the omni_radtan run (same physical rig).
#
# Run (override input.path for dataset-calib-imu{1,2,3,4}.bag):
#   mvis cam-imu -c examples/configs/tumvi_cam_imu/cam_imu_equi.yaml
#
# Reference (Kalibr): ${MVIS_DATASETS}/tum_vi_calib/pinhole-equi-1024/

mode: cam-imu
input:
  format: ros1
  path: ${MVIS_DATASETS}/tum_vi_calib/raw/dataset-calib-imu1.bag
  imu_topics: ["/imu0"]
  window_mode: manual    # keep the explicit t0/window below (was the pre-motion default)
  t0: 3.0
  window: 45.0
  cache_dir: /tmp/mvis_tumvi_detcache

board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.088
  tag_spacing: 0.3
  tag_family: t36h11

camera_input:                         # TUM-VI equidistant (KB4) camchain
  path: ${MVIS_DATASETS}/tum_vi_calib/tumvi_camchain.yaml
  free_intrinsics: false
  estimate_readout: false

solve:
  state_hz: 8.0
  max_iterations: 40
  imu_intrinsics: dw_da
  corner_subsample: top_left
  sigma_td_prior: 0.0
  init_kwargs: {keyframe_hz: 2.0, scale_rel_tol: 0.3}

output:
  path: results/tumvi_cam_imu/imu1_equi.json
