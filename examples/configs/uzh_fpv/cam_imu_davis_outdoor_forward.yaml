# Cam-IMU full calibration — UZH-FPV outdoor_forward davis imu bag (all params free).
#
# Board (official target.yaml, all sequences): AprilGrid 5 cols x 4 rows,
# tag 0.075 m, spacing 0.2, t36h11.
#
# Run:
#   mvis cam-imu -c examples/configs/uzh_fpv/cam_imu_davis_outdoor_forward.yaml
# Round-trip validation:
#   mvis roundtrip -c examples/configs/uzh_fpv/cam_imu_davis_outdoor_forward.yaml
#
# Reference (Kalibr, shipped zip):
#   ${MVIS_DATASETS}/UZH/outdoor_forward_calib_davis/outdoor_forward_calib_davis/camchain-imucam-..outdoor_forward_calib_davis_imu.yaml

mode: cam-imu
input:
  format: ros1
  path: ${MVIS_DATASETS}/UZH/davis/outdoor_forward_calib_davis_imu.bag
  imu_topics: ["/dvs/imu"]
  cache_dir: /tmp/mvis_uzh_detcache

board:
  board_type: apriltag
  rows: 4
  cols: 5
  tag_size: 0.075
  tag_spacing: 0.2
  tag_family: t36h11

camera_input:
  path: ${MVIS_DATASETS}/UZH/outdoor_forward_calib_davis/outdoor_forward_calib_davis/camchain-..outdoor_forward_calib_davis_cam.yaml
  estimate_readout: false

solve:
  imu_intrinsics: dw_da
  estimate_t_ga: true

output:
  path: results/uzh_fpv/davis_outdoor_forward_cam_imu.json
