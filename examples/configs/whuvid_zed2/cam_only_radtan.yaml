# Camera-only stereo calibration — WHUVID (Wuhan Univ.) ZED2, calibration recording myCalibrate.bag
# (ROS 1, 74 s, /cam{0,1}/image_raw mono8 1280x720 19.7 Hz, /imu0 ~400 Hz). Baidu Netdisk, no licence stated.
# Board (from the authors' Kalibr report): AprilGrid 6x6, tag 20.8 mm, spacing 0.3, t36h11.
# Reference: the dataset authors' Kalibr calibration (pinhole-radtan, baseline 120.1 mm).
# Run: mvis cam -c examples/configs/whuvid_zed2/cam_only_radtan.yaml
mode: cam
board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.0208
  tag_spacing: 0.3
  tag_family: t36h11
input:
  cameras:
  - camera_id: 0
    name: cam0
    source_type: rosbag_topic
    source_path: ${MVIS_DATASETS}/whuvid/myCalibrate.bag
    topic: /cam0/image_raw
    distortion_model: radtan
    shutter_type: global
  - camera_id: 1
    name: cam1
    source_type: rosbag_topic
    source_path: ${MVIS_DATASETS}/whuvid/myCalibrate.bag
    topic: /cam1/image_raw
    distortion_model: radtan
    shutter_type: global
solve:
  max_iterations: 20
  max_init_frames: 100
  pixel_sigma: 1.0
  huber_threshold: 1.345
reference_camera: 0
optimize_time_offset: false
rerun_visualization: false
output:
  path: results/whuvid_zed2/cam_only_radtan.yaml
  format: yaml
