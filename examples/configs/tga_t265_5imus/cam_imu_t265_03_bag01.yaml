# t265-unit-03 cam-IMU calibration with gyro<->accel time offset.
# Rig: vi_sensor_rigs_5imus — this rig carries TWO t265 units (t265_01, t265_03),
# each with its own fisheye stereo + BMI055 IMU. Calibrated per unit: this config
# uses the t265_03 stereo pair + /t265_03/imu as base. Studies per-unit t_ga.
mode: cam-imu
input:
  format: ros1
  path: ${MVIS_DATASETS}/vi_sensor_rigs_5imus/5imus_4cams_01.bag
  cam_topics:
    - /t265_03/fisheye1/image_raw     # T265-03-L (global)  <- base
    - /t265_03/fisheye2/image_raw     # T265-03-R (global)
  imu_topics:
    - /t265_03/imu                    # BMI055 of unit 03 (base; the sensor under test)
  window_mode: motion
  segment_length: 80.0
  cache_dir: /tmp/mvis_detcache

board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.088
  tag_spacing: 0.3
  tag_family: t36h11

camera_input:
  path: examples/configs/tga_t265_5imus/t265_03_calib.yaml

solve:
  max_iterations: 40
  estimate_t_ga: true
  sigma_t_ga: 0.010

estimate:
  camera:
    intrinsics: false
    tr: false
    td: true
    extrinsics: true
  imu:
    intrinsics: dw_da
    model: calyx

output:
  path: results/tga_t265_5imus/unit03_bag01/cam_imu.json
