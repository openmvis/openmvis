# MVIS — Stereo Camera with Rolling Shutter
#
# Two cameras with different shutter types.
# RS readout, time offset, and extrinsics calibrated jointly.
#
# Run with:   mvis run -c examples/configs/example_stereo_rs.yaml   (or: mvis cam -c ...)

mode: cam
board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.088
  tag_spacing: 0.3
  tag_family: t36h11

input:
  cameras:
    - camera_id: 0
      name: cam0
      source_type: rosbag_topic
      source_path: /path/to/recording.bag
      topic: /cam0/image_raw
      distortion_model: equidistant  # fisheye
      shutter_type: global

    - camera_id: 1
      name: cam1
      source_type: rosbag_topic
      source_path: /path/to/recording.bag
      topic: /cam1/image_raw
      distortion_model: radtan
      shutter_type: rolling          # RS readout will be calibrated

solve:
  max_iterations: 15
  pixel_sigma: 1.0
  huber_threshold: 1.345

reference_camera: 0
output:
  path: stereo_rs_result.yaml
  format: yaml
