mode: cam-imu
input:
  format: ros1
  path: <DATA>/virig_4imus_3cams_april_01.bag
  cam_topics:
  - /blackfly/image_raw
  - /t265/fisheye1/image_raw
  - /t265/fisheye2/image_raw
  imu_topics:
  - /imu/data
  - /gx3_25/data
  - /gx3_35/imu/data
  - /t265/imu
  window_mode: motion
  segment_length: 80.0
  cache_dir: <RUN>/cache
board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.088
  tag_spacing: 0.3
  tag_family: t36h11
camera_input:
  path: <RUN>/05_solve/attempt-01/cam/calibration.yaml
solve:
  max_iterations: 40
  rms_gate_px: 3.0
estimate:
  camera:
    intrinsics: false
    tr: false
    td: true
    extrinsics: true
  imu:
    intrinsics: dw_da
    model: calyx
    extrinsics: true
    td: true
output:
  path: <RUN>/05_solve/attempt-01/cam_imu/cam_imu.json
