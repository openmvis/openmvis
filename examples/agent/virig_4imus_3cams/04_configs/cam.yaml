mode: cam
input:
  cameras:
  - camera_id: 0
    name: Blackfly
    source_type: rosbag_topic
    source_path: <DATA>/virig_4imus_3cams_april_01.bag
    topic: /blackfly/image_raw
    distortion_model: radtan
    shutter_type: global
    factor_hz: 15.0
  - camera_id: 1
    name: T265-1
    source_type: rosbag_topic
    source_path: <DATA>/virig_4imus_3cams_april_01.bag
    topic: /t265/fisheye1/image_raw
    distortion_model: equidistant
    shutter_type: global
    factor_hz: 15.0
  - camera_id: 2
    name: T265-2
    source_type: rosbag_topic
    source_path: <DATA>/virig_4imus_3cams_april_01.bag
    topic: /t265/fisheye2/image_raw
    distortion_model: equidistant
    shutter_type: global
    factor_hz: 15.0
board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.088
  tag_spacing: 0.3
  tag_family: t36h11
solve:
  max_iterations: 15
  max_init_frames: 100
  pixel_sigma: 1.0
  huber_threshold: 1.345
output:
  path: <RUN>/05_solve/attempt-01/cam/calibration.yaml
  format: yaml
reference_camera: 0
optimize_time_offset: true
rerun_visualization: false
