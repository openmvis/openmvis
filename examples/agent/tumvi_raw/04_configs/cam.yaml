mode: cam
input:
  cameras:
  - camera_id: 0
    name: cam0
    source_type: rosbag_topic
    source_path: <DATA>/dataset-calib-cam1.bag
    topic: /cam0/image_raw
    distortion_model: equidistant
    shutter_type: global
  - camera_id: 1
    name: cam1
    source_type: rosbag_topic
    source_path: <DATA>/dataset-calib-cam1.bag
    topic: /cam1/image_raw
    distortion_model: equidistant
    shutter_type: global
board:
  board_type: apriltag
  rows: 6
  cols: 6
  tag_size: 0.088
  tag_spacing: 0.3
  tag_family: t36h11
solve:
  max_iterations: 15
  max_init_frames: 100
  pixel_sigma: 1.0
  huber_threshold: 1.345
output:
  path: <RUN>/05_solve/attempt-01/cam/calibration.yaml
  format: yaml
reference_camera: 0
optimize_time_offset: false   # hardware-triggered stereo
rerun_visualization: false
